{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "parla.dataClaim" . }}
  labels: {{- include "parla.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # helm uninstall doesn't delete the data
    {{- with .Values.persistence.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.persistence.size }}}
{{- end }}
