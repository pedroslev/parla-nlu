{{- $data := dict }}
{{- if and .Values.metrics.token (not .Values.metrics.existingSecret) }}{{ $_ := set $data "metrics" (dict .Values.metrics.secretKey .Values.metrics.token) }}{{ end }}
{{- if and .Values.otel.headers (not .Values.otel.existingSecret) }}{{ $_ := set $data "otel" (dict .Values.otel.secretKey .Values.otel.headers) }}{{ end }}
{{- if and .Values.database.url (not .Values.database.existingSecret) }}{{ $_ := set $data "database" (dict .Values.database.secretKey .Values.database.url) }}{{ end }}
{{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}{{ $_ := set $data "oidc" (dict .Values.oidc.secretKey .Values.oidc.clientSecret) }}{{ end }}
{{- range $suffix, $values := $data }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parla.fullname" $ }}-{{ $suffix }}
  labels: {{- include "parla.labels" $ | nindent 4 }}
type: Opaque
stringData: {{- toYaml $values | nindent 2 }}
{{- end }}
{{- if and (include "parla.secretKeyEnabled" .) (not .Values.secretKey.existingSecret) }}
{{- /* PARLA_SECRET_KEY: the given value, or the one generated on a previous install (lookup), or a new random one */}}
{{- $name := printf "%s-secret-key" (include "parla.fullname" .) }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $key := .Values.secretKey.value | default (get $old .Values.secretKey.secretKey | b64dec) | default (randAlphaNum 64) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "parla.labels" . | nindent 4 }}
  {{- if not .Values.secretKey.value }}
  annotations:
    helm.sh/resource-policy: keep      # generated: losing it means losing the encrypted secrets
  {{- end }}
type: Opaque
stringData:
  {{ .Values.secretKey.secretKey }}: {{ $key | quote }}
{{- end }}
