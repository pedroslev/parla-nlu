{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "parla.fullname" . }}
  labels: {{- include "parla.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "parla.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with $np.ingress.namespaces }}
    - from:
        {{- range . }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
        {{- end }}
      ports: [{port: http, protocol: TCP}]
    {{- end }}
    {{- with $np.ingress.extra }}{{ toYaml . | nindent 4 }}{{ end }}
  egress:
    {{- if $np.egress.dns }}
    - to: [{namespaceSelector: {}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- end }}
    {{- if $np.egress.internet.enabled }}
    # public internet only: AI/voice providers, WhatsApp/Telegram APIs, model downloads, your http steps
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml $np.egress.internet.except | nindent 14 }}
      ports:
        {{- range $np.egress.internet.ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- end }}
    {{- if .Values.ollama.enabled }}
    - to:
        - podSelector:
            matchLabels: {{- include "parla.ollamaLabels" . | nindent 14 }}
      ports: [{port: 11434, protocol: TCP}]
    {{- end }}
    {{- with $np.egress.extra }}{{ toYaml . | nindent 4 }}{{ end }}
{{- if .Values.ollama.enabled }}
---
# Ollama: only Parla may call it (its own egress, to pull models, stays open)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "parla.fullname" . }}-ollama
  labels: {{- include "parla.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "parla.ollamaLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "parla.selectorLabels" . | nindent 14 }}
      ports: [{port: 11434, protocol: TCP}]
{{- end }}
{{- end }}
