# Parla: a single replica (SQLite + files on one volume, state in memory). See docs/kubernetes.md.
# kubectl apply -n parla -k deploy/k8s
# The Helm chart (deploy/helm/parla) is the full-featured path: SSO, metrics, backups, NetworkPolicy and Ollama as values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: parla
data:
  PARLA_FUNCTIONS: "0"      # "function" steps = arbitrary code in the pod; 1 only if you trust every editor
  PARLA_WHISPER: "base"
  # PARLA_LANG: "en"         # default interface language: en, es or pt (unset = the browser's)
  # PARLA_PUBLIC_URL: "https://bots.example.com"   # webhooks (WhatsApp, Telegram, phone; docs/channels.md) and SSO
  # PARLA_RETENTION_DAYS: "90"                      # delete idle conversations after N days (unset = keep)
  # PARLA_AUDIT_DAYS: "365"
  # Admin UI through the Ingress (publish "/" too; docs/kubernetes.md):
  # PARLA_HOSTS: "bots.example.com"
  # PARLA_SECURE_COOKIE: "1"
  # Observability (docs/observability.md). Tokens and headers go in Secrets (secretRef below), not here:
  #   kubectl -n parla create secret generic parla-metrics --from-literal=PARLA_METRICS_TOKEN="$(openssl rand -hex 24)"
  #   kubectl -n parla create secret generic parla-otel --from-literal=OTEL_EXPORTER_OTLP_HEADERS='x-honeycomb-team=<key>'
  # PARLA_METRICS: "1"
  # PARLA_OTEL_ENDPOINT: "http://otel-collector.observability:4318"
  # OTEL_SERVICE_NAME: "parla"
  # PARLA_LOG_FORMAT: "json"
  # Single sign-on (docs/sso.md). The client secret is a file from a Secret (volume "oidc" below):
  #   kubectl -n parla create secret generic parla-oidc --from-literal=client-secret='<the client secret>'
  # PARLA_OIDC_ISSUER: "https://kc.example.com/realms/acme"
  # PARLA_OIDC_CLIENT_ID: "parla"
  # PARLA_OIDC_CLIENT_SECRET_FILE: "/run/secrets/parla-oidc/client-secret"
  # PARLA_OIDC_ROLE_CLAIM: "groups"
  # PARLA_OIDC_ROLE_MAP: "parla-owners:owner,parla-editors:editor"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parla-data
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName: <your cluster's>   # without this it uses the default class (on k3s: local-path)
  resources:
    requests:
      storage: 5Gi           # ~1.2 GB embedding model + ~0.3 GB voice + agents and conversations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parla
  labels: {app: parla}
spec:
  replicas: 1                # don't scale up: see docs/deployment.md (one replica per data folder)
  strategy:
    type: Recreate           # RWO + files: never two pods on the same volume
  selector:
    matchLabels: {app: parla}
  template:
    metadata:
      labels: {app: parla}
      # Prometheus with annotation-based discovery (the token still has to be set in its scrape config):
      # annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: "/metrics"}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: parla
          image: ghcr.io/pedroslev/parla-nlu:edge   # pin a release (0.9.0) or your registry; kustomization.yaml "images:"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: parla}
            # - secretRef: {name: parla-metrics}     # PARLA_METRICS_TOKEN for /metrics
            # - secretRef: {name: parla-otel}        # OTEL_EXPORTER_OTLP_HEADERS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            # - {name: oidc, mountPath: /run/secrets/parla-oidc, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 1536Mi}
            limits: {memory: 3Gi}      # with voice: 4Gi. No CPU limit: training and transcribing use short bursts
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: parla-data}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        # - name: oidc
        #   secret: {secretName: parla-oidc, defaultMode: 0440}   # group-readable: fsGroup 10001
---
apiVersion: v1
kind: Service
metadata:
  name: parla
  labels: {app: parla}       # the ServiceMonitor example (servicemonitor.yaml) selects it by this
spec:
  selector: {app: parla}
  ports:
    - {name: http, port: 8000, targetPort: http}
