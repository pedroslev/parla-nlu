# Prometheus for `docker compose --profile observability` (see docs/observability.md).
# Parla's /metrics needs the bearer token when scraped from another container: compose mounts
# PARLA_METRICS_TOKEN as the secret file below.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: parla
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/parla_metrics_token
    static_configs:
      - targets: ["parla:8000"]
