<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parla</title>
<meta name="description" content="Armá bots que entienden: intenciones, entidades y conversaciones, sin programar.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233346D3'/%3E%3Cpath d='M22 50V14h13a11 11 0 0 1 0 22h-6v14z M29 21v8h6a4 4 0 0 0 0-8z' fill='%23fff' fill-rule='evenodd'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ECEFF4; --surface: #FFFFFF; --ink: #172033; --muted: #5D6880; --line: #D5DBE6; --soft: #F5F7FA;
    --brand: #3346D3; --brand-soft: #E4E8FF; --user: #DCE3FF; --warn: #A8401A; --warn-soft: #FDEDE4; --ok: #1F7A4D;
    --display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }   /* sin rebote ni "tirar para refrescar" */
  #center, #log, #chat, .pop, .side, .kv, #nav { overscroll-behavior: contain; }
  /* barras de desplazamiento finitas y del color del tema; en el menú y las listas solo aparecen al pasar el mouse */
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent) transparent; }
  #nav, .side { scrollbar-color: transparent transparent; scrollbar-gutter: stable; transition: scrollbar-color .2s; }
  #nav:hover, .side:hover, #nav:focus-within, .side:focus-within { scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent) transparent; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "DM Sans", system-ui, -apple-system, sans-serif; }
  h1, h2, p { margin: 0; }
  h1 { font: 700 28px/1.15 var(--display); letter-spacing: -.01em; }
  h2 { font: 600 16px/1.3 "DM Sans", system-ui, sans-serif; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  input::placeholder, textarea::placeholder { color: #9AA3B5; }
  textarea { width: 100%; resize: none; overflow: hidden; display: block; }
  select { cursor: pointer; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 600; white-space: nowrap; }
  .btn.quiet { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: none; color: var(--warn); padding-left: 0; font-weight: 500; }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .icon-btn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
  .icon-btn:hover:not(:disabled) { background: var(--soft); color: var(--ink); }
  .help { color: var(--muted); max-width: 62ch; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label.f > * { font-size: 15px; color: var(--ink); }

  /* Inicio */
  .home { min-height: 100%; display: flex; flex-direction: column; overflow-y: auto;
    background: radial-gradient(45% 40% at 0% 100%, color-mix(in srgb, #6A4CF5 14%, transparent), transparent 70%),
                radial-gradient(40% 45% at 100% 75%, color-mix(in srgb, #1FB8C9 13%, transparent), transparent 70%),
                radial-gradient(30% 30% at 70% 100%, color-mix(in srgb, #FF7AB8 10%, transparent), transparent 70%),
                color-mix(in srgb, var(--bg) 93%, #6A4CF5); background-attachment: fixed; }
  .home-in { width: min(1040px, 100%); margin: 0 auto; padding: 0 24px; }
  /* el mismo cielo que la pantalla de entrada: Parla se siente una sola app */
  .home-hero { position: relative; overflow: hidden; color: #fff; flex: none; width: min(1040px, calc(100% - 32px)); margin: 20px auto 0;
    border-radius: 28px; padding: 26px 0 40px; box-shadow: 0 30px 60px -30px rgba(42, 54, 184, .55);
    background: radial-gradient(90% 120% at 0% 0%, #6A4CF5 0%, transparent 55%), radial-gradient(70% 120% at 100% 100%, #1FB8C9 0%, transparent 50%),
                radial-gradient(50% 90% at 80% 0%, #FF7AB8 0%, transparent 45%), #2A36B8; }
  .home-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .45;
    background-image: radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.4px); background-size: 22px 22px;
    mask-image: linear-gradient(170deg, #000 20%, transparent 80%); }
  .home-hero .home-in { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 clamp(20px, 4vw, 44px); width: auto; }
  .home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .home-logo { font: 800 30px/1 var(--display); letter-spacing: -.04em; }
  .home-logo i { font-style: normal; color: #FFD166; }
  .home-hero h1 { font: 800 clamp(40px, 6vw, 64px)/1 var(--display); letter-spacing: -.035em; }
  .home-lead { font: 500 18px/1.4 var(--display); opacity: .9; max-width: 52ch; }
  .home-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .home .home-hero .btn:not(.quiet) { background: #fff; color: #2A36B8; box-shadow: 0 10px 24px -12px rgba(10, 15, 60, .6); }
  .home-hero .btn.quiet, .home-hero .home-top .btn { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.3); box-shadow: none; backdrop-filter: blur(6px); }
  .home-hero .btn.quiet:hover, .home-hero .home-top .btn:hover { background: rgba(255,255,255,.24); }
  .home-hero .th-switch { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); }
  .home-hero .th-switch button { color: rgba(255,255,255,.85); }
  .home-hero .th-switch button:hover { background: rgba(255,255,255,.18); color: #fff; }
  .home-hero .th-switch button[aria-pressed="true"] { background: #fff; color: #2A36B8; }
  .home .home-body { width: min(1040px, calc(100% - 32px)); padding: 0 0 56px; margin-top: 36px; display: flex; flex-direction: column; gap: 14px; }
  .home-body h2 { font: 700 22px var(--display); letter-spacing: -.01em; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .home-body h2 .count { background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 1px 10px; font-size: 14px; }
  .agent-av { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; font: 800 20px var(--display);
    background: linear-gradient(135deg, var(--hue), color-mix(in srgb, var(--hue) 55%, #1B2160)); box-shadow: 0 8px 18px -10px var(--hue); margin-bottom: 8px; }
  .home .agent .agent-av { color: #fff; font-size: 20px; }
  .agent-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 10px; }
  .agent .agent-meta span { font-size: 12.5px; color: var(--ink); background: color-mix(in srgb, var(--hue) 12%, var(--surface)); border-radius: 999px; padding: 2px 10px; }
  .home .agent { min-height: 168px; box-shadow: 0 14px 30px -22px rgba(23, 32, 51, .45); }
  .home .agent.new { background: var(--surface); border: 1.5px dashed color-mix(in srgb, var(--brand) 45%, var(--line)); gap: 8px; }
  @media (max-width: 600px) { .home-hero { border-radius: 22px; margin-top: 12px; } .home-top { margin-bottom: 14px; } }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand .logo { font: 700 22px var(--display); color: var(--brand); letter-spacing: -.02em; }
  .home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .top .logo { font: 700 17px var(--display); color: var(--brand); letter-spacing: -.02em; padding-right: 4px; }
  .import-error { color: var(--warn); }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .agent { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
  .agent:hover { border-color: var(--brand); }
  .agent strong { font: 700 20px/1.2 var(--display); }
  .agent span { color: var(--muted); font-size: 14px; }
  .agent.new { border-style: dashed; background: none; color: var(--brand); align-items: center; justify-content: center; font-weight: 600; flex-direction: row; }

  /* Espacio de trabajo */
  .work { height: 100%; display: grid; grid-template: 56px minmax(0, 1fr) / 228px minmax(0, 1fr) 360px; }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top .back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 500; padding: 6px 10px 6px 4px; border-radius: 8px; }
  .top .back:hover { background: var(--soft); color: var(--ink); }
  .top .agent-name { font: 700 18px var(--display); border-color: transparent; background: none; flex: 0 1 340px; }
  .top .agent-name:hover { border-color: var(--line); }
  #status { margin-left: auto; color: var(--muted); font-size: 13px; }
  #train { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  #train .state { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  #train .state.done { color: var(--ok); border-radius: 8px; padding: 6px 8px; }
  #train button.state.done:hover { background: var(--soft); text-decoration: underline; text-underline-offset: 3px; }
  #train .state.pending { color: var(--warn); font-weight: 500; }
  .train-note { margin: 0 16px 10px; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px; }
  .words button { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 15px; }
  .words button[aria-pressed="true"] { background: var(--mark, #B5F0B0); border-color: transparent; font-weight: 600; }
  .taught { display: flex; flex-direction: column; }
  .taught .phrase-row .phrase { font-size: 15px; padding: 6px 4px; }
  #nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid var(--line); background: var(--surface); overflow: hidden; }
  #nav button { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 34px; flex: 0 1 34px; min-height: 26px; border-radius: 9px; color: var(--muted); font-weight: 500; text-align: left; }
  #nav .nav-group { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 0 12px 2px; height: 26px; flex: 0 1 26px; min-height: 16px; display: flex; align-items: flex-end; opacity: .8; }
  #nav .nav-group:first-child { padding-top: 0; }
  #nav button:hover { background: var(--brand-soft); color: var(--brand); }
  .opt-theme { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 4px; margin-top: 4px; border-top: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .top .more { width: 36px; height: 36px; }
  #nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  #nav .count { margin-left: auto; font-size: 13px; font-weight: 400; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  #nav button > span:not(.count) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #center { overflow-y: auto; padding: 28px 32px 80px; }
  /* todo el contenido arranca pegado a la barra; lo que se limita es el ancho de lectura, no la grilla */
  .page { max-width: 820px; display: flex; flex-direction: column; gap: 18px; }
  .two { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
  .two > .empty { max-width: 820px; }
  #center .sv { margin: 0; }          /* Conversaciones (static/sessions.js) sigue la misma regla */
  [hidden] { display: none !important; }
  .panel:has(> .phrase-row):not(:has(> .phrase-row:not([hidden]))) { display: none; }   /* la búsqueda ocultó todas las filas */
  .page-head { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
  .page-head h1 { flex: 1 0 auto; margin-right: auto; }
  .page-head input[type="search"] { flex: 0 1 240px; min-width: 160px; }
  @media (max-width: 520px) { .page-head input[type="search"] { flex: 1 1 100%; order: 3; } }
  .swatch { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; flex: none; overflow: hidden; }
  .swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch::-webkit-color-swatch { border: 1px solid rgba(0, 0, 0, .15); border-radius: 50%; }
  .swatch::-moz-color-swatch { border: 1px solid rgba(0, 0, 0, .15); border-radius: 50%; }
  .swatches { display: flex; gap: 4px; align-items: center; }
  .swatches button { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; }
  .side button.item { text-align: left; padding: 9px 12px; border-radius: 10px; display: flex; flex-direction: column; }
  .side button.item:hover { background: var(--surface); }
  .side button.item[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--brand); font-weight: 600; }
  .side button.item small { color: var(--muted); font-weight: 400; }
  .side .add { color: var(--brand); font-weight: 600; padding: 9px 12px; text-align: left; display: flex; gap: 6px; align-items: center; }
  .title { font: 700 28px/1.15 var(--display); border-color: transparent; background: none; padding: 4px 8px; margin-left: -8px; width: 100%; }
  .title:hover, .title:focus { border-color: var(--line); background: var(--surface); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .notice { background: var(--brand-soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .notice.warn { background: var(--warn-soft); }
  .link { color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* Frases y marcas */
  .add-phrase { display: flex; gap: 8px; }
  .add-phrase input { flex: 1; padding: 12px 14px; border-radius: 12px; font-size: 16px; }
  .phrases { display: flex; flex-direction: column; }
  .phrase-row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
  .phrase-row:last-child { border-bottom: 0; }
  .phrase { flex: 1; padding: 11px 4px; font-size: 16px; line-height: 1.9; cursor: text; overflow-wrap: anywhere; }
  .phrase-row input { flex: 1; margin: 6px 0; font-size: 16px; }
  mark { border-radius: 6px; padding: 3px 6px; cursor: pointer; }
  mark::after { content: attr(data-entity); margin-left: 6px; font-size: 11px; font-weight: 600; opacity: .8; vertical-align: 1px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; display: inline-block; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .values { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .values input { flex: 1; min-width: 160px; }
  .value { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 12px; }
  .value button { width: 22px; height: 22px; border-radius: 50%; color: var(--muted); }
  .option { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .option .also { color: var(--muted); font-size: 13px; }

  /* Menú flotante */
  .pop { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 12px 32px rgba(23, 32, 51, .18); display: flex; flex-direction: column; gap: 4px; max-width: 340px; max-height: 70vh; overflow: auto; }
  .pop-title { font-size: 13px; color: var(--muted); padding: 4px 8px; }
  .pop .opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; text-align: left; }
  .pop .opt:hover, .pop .opt:focus-visible { background: var(--soft); }
  .pop .opt small { display: block; color: var(--muted); font-size: 13px; }
  .pop form { display: flex; gap: 6px; padding: 4px; }
  .pop form input { flex: 1; min-width: 150px; }
  .pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
  .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--soft); }
  .badge.message, .badge.ask { background: var(--brand-soft); color: var(--brand); }
  .badge.http { background: #DDF3EC; color: #136B52; }
  .badge.if { background: #EEE6FB; color: #5B2DA8; }
  .badge.set { background: #FBEFD2; color: #7A5200; }
  .badge.classify { background: #FDE3EE; color: #8A1F52; }
  .badge.call { background: var(--soft); color: var(--ink); }
  .badge.agent { background: var(--brand-soft); color: var(--brand); }
  .badge.handoff { background: var(--warn-soft); color: var(--warn); }

  /* Botones, idiomas, interruptores */
  .btn-edit { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .btn-edit .row { flex-wrap: nowrap; gap: 6px; }
  .btn-edit input { font-size: 14px; padding: 6px 10px; border-radius: 999px; }
  .btn-edit .lbl { flex: 1 1 55%; }
  .btn-edit .val { flex: 1 1 45%; color: var(--muted); }
  .lang-pick { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-left: auto; }
  .lang-pick button { padding: 1px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .lang-pick button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
  .bubble .who { display: flex; align-items: center; gap: 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--muted); background: var(--surface); display: inline-flex; gap: 6px; align-items: center; }
  .pill[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .pill small { font-weight: 400; font-size: 12px; }
  input.switch { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); border: 0; padding: 0; position: relative; cursor: pointer; flex: none; transition: background .15s; }
  input.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: left .15s; }
  input.switch:checked { background: var(--ok); }
  input.switch:checked::after { left: 19px; }
  label.toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
  .side-group { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 16px 12px 4px; }
  .side button.item small.on { color: var(--ok); }

  /* Armador de flujos: se lee como una conversación */
  .canvas { max-width: 760px; display: flex; flex-direction: column; }
  .trigger { align-self: flex-end; max-width: 80%; background: var(--user); border-radius: 18px 18px 4px 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
  .trigger small { color: var(--muted); }
  .trigger em { font-style: normal; font-size: 16px; }
  .steps { display: flex; flex-direction: column; }
  .insert-row { display: flex; justify-content: center; position: relative; padding: 6px 0; }
  .insert-row::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px dotted var(--line); }
  .insert { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 26px; min-width: 26px; justify-content: center; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .insert .ic { width: 14px; height: 14px; }
  .insert:hover { border-color: var(--brand); color: var(--brand); }
  .insert.labeled { height: 38px; padding: 0 18px; color: var(--brand); border-color: var(--brand); font-weight: 600; }
  .step { display: flex; gap: 6px; align-items: flex-start; }
  .tools { display: flex; opacity: .5; }
  .step:hover > .tools, .step:focus-within > .tools { opacity: 1; }
  .bot-side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .bubble { width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }

}

}

    const f = { name: uniqueName(agent.flows, 'Bienvenida'), trigger: START, steps: [] };

    h('p', { class: 'help' }, 'Probá cómo arranca la conversación cuando llegan datos de antes, por ejemplo el DNI que ya pidió el conmutador.'),
    agent.slots.length ? agent.slots.map((s) => lab(s.name, h('input', { value: startData[s.name] ?? '', placeholder: 'valor que llega al iniciar', autocomplete: 'off',
      oninput: (e) => { startData[s.name] = e.target.value; }, onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } } })))

}
function readLine(m) {

  if (m.taught) return h('div', { class: 'read' }, 'Aprendido: ahora esa frase cuenta como «' + m.taught + '».');
  const teach = h('button', { class: 'link', onclick: (e) => openPop(e.currentTarget.getBoundingClientRect(), [h('p', { class: 'pop-title' }, '«' + m.text + '» quiere decir…'),
    agent.intents.map((it) => h('button', { class: 'opt', onclick: () => { it.examples.unshift(m.text.replace(/[\[\]]/g, '')); m.taught = it.name; touch(); render(); renderChat(); } }, it.name))]) }, 'Enseñarle');
  const ents = m.nlu.entities.map((e) => [' ', h('mark', { 'data-entity': e.entity, style: markStyle(entityOf(e.entity)) }, e.value)]);
  const pct = ' (' + Math.round(m.nlu.confidence * 100) + '%)';
  if (m.rejected) {
    const e = entityOf(agent.slots.find((v) => v.name === m.answerTo)?.entity);
    if (m.taughtValue) return h('div', { class: 'read' }, 'Aprendido: «' + m.text + '» ahora cuenta como ' + m.taughtValue + '. Mandalo de nuevo.');
    return h('div', { class: 'read' }, 'No lo reconoció como ', h('strong', {}, e?.name || m.answerTo), '. ',
      e?.values?.length ? h('button', { class: 'link', onclick: (ev) => openPop(ev.currentTarget.getBoundingClientRect(), [h('p', { class: 'pop-title' }, '«' + m.text + '» es otra forma de decir…'),
        e.values.map((v) => h('button', { class: 'opt', onclick: () => { (((e.synonyms ||= {})[v]) ||= []).push(m.text.trim().toLowerCase()); m.taughtValue = v; touch(); render(); renderChat(); } }, v))]) }, 'Enseñarle') : null);
  }
  if (m.answerTo != null) {

      whole && slot && (!e || (!e.regex && !e.values?.length)) ? [' ', h('button', { class: 'link', onclick: (ev) => markAnswer(ev, m, slot) }, 'Marcar el dato')] : null);

}
function markAnswer(ev, m, slot) {     // "mi nombre es olivia": la persona elige qué palabras son el dato
  const text = m.text.replace(/[\[\]]/g, '').trim();
  const toks = [...text.matchAll(/[\p{L}\p{N}_]+(?:[.'@-][\p{L}\p{N}_]+)*/gu)];
  const on = new Set();
  const save = h('button', { class: 'btn small', disabled: true, onclick: () => {
    const picked = [...on].sort((a, b) => a - b), start = toks[picked[0]].index, last = toks[picked[picked.length - 1]];
    const name = slot.entity || createEntity(slot.name);
    const e = entityOf(name);
    (e.examples ||= []).push(text.slice(0, start) + '[' + text.slice(start, last.index + last[0].length) + '](' + name + ')' + text.slice(last.index + last[0].length));
    m.marked = true; closePop(); touch(); render(); renderChat();
  } }, 'Guardar ejemplo');
  const words = toks.map((t, i) => h('button', { 'aria-pressed': 'false', onclick: (e) => {
    on.has(i) ? on.delete(i) : on.add(i);
    if (on.size) { const lo = Math.min(...on), hi = Math.max(...on); for (let j = lo; j <= hi; j++) on.add(j); }   // las palabras van seguidas
    words.forEach((b, j) => b.setAttribute('aria-pressed', String(on.has(j))));
    save.disabled = !on.size;
  } }, t[0]));
  openPop(ev.currentTarget.getBoundingClientRect(), [h('p', { class: 'pop-title' }, 'Tocá las palabras que son el ' + slot.name + ':'), h('div', { class: 'words' }, words),
    h('div', { style: 'padding:4px 8px' }, save)]);
}
// ---------- turno: mensajes, botones, quién respondió, idioma y paso a una persona ----------
let lastLang = null, handoff = null, pollAfter = 0, pollSession = null, voiceState = '', voiceStop = null;
let speakOn = (() => { try { return localStorage.getItem('parla.speak') === '1'; } catch { return false; } })();
const voiceOk = () => { try { return !!window.parlaVoice?.available?.(); } catch { return false; } };
const say = (text) => { if (speakOn && voiceOk() && text) Promise.resolve(window.parlaVoice.speak(text, lastLang || langs()[0])).catch(() => {}); };
function takeTurn(r) {
  lastSlots = r.slots || lastSlots; lastTrace = r.trace || [];
  if (r.language) lastLang = r.language;
  const bots = [];
  (r.messages || []).forEach((t) => { const m = { who: t.startsWith('⚠') ? 'problem' : 'bot', text: t.replace(/^⚠ /, '') }; chat.push(m); if (m.who === 'bot') bots.push(m); });
  const last = bots[bots.length - 1];
  if (last && r.buttons?.length) last.buttons = r.buttons;               // los botones son del último mensaje
  if (last && r.via) { last.via = r.via; last.sources = r.sources || []; }
  if (r.handoff) startHandoff(); else if (r.handoff === false) stopHandoff();
  say(bots.map((m) => m.text).join('\n'));
}
function stopHandoff() { if (handoff) clearInterval(handoff); handoff = null; }
function startHandoff() {               // mientras responde una persona, cada 3 s traemos lo que escribió (desde Bandeja)
  if (handoff || !agent) return;
  const sid = session, id = agent.id;
  if (pollSession !== sid) { pollSession = sid; pollAfter = 0; }
  handoff = setInterval(async () => {
    if (!handoff || session !== sid || agent?.id !== id) return stopHandoff();
    try {
      const r = await fetch('/api/v1/bots/' + encodeURIComponent(id) + '/sessions/' + encodeURIComponent(sid) + '/messages?after=' + pollAfter);
      if (!r.ok || !handoff || session !== sid) return;
      const body = await r.json();
      const items = Array.isArray(body) ? body : body.messages || body.history || [];
      pollAfter = body.next ?? body.total ?? pollAfter + items.length;
      const news = items.filter((m) => m && m.from === 'human' && m.text);
      news.forEach((m) => chat.push({ who: 'human', text: m.text, by: m.by }));
      const ended = body.handoff === false || body.handoff?.active === false;
      if (ended) { stopHandoff(); chat.push({ who: 'event', text: 'La persona devolvió la charla: vuelve a responder el bot.' }); }
      if (news.length || ended) { renderChat(); say(news.map((m) => m.text).join('\n')); }
    } catch {}
  }, 3000);
}
async function sendText(text, shown) {   // shown: lo que se ve en el chat (el texto del botón); text: lo que se manda
  const mine = { who: 'user', text: shown || text };
  chat.push(mine); renderChat();
  try {
    await saveNow();                    // el chat usa lo último que se editó
    const r = await api('POST', '/' + agent.id + '/chat', { session, text, environment: testEnv });
    mine.nlu = r.nlu; mine.answerTo = r.answer_to; mine.rejected = r.rejected; mine.saved = r.answer_to ? r.slots[r.answer_to] : null;
    takeTurn(r);
    if (!r.messages.length && !handoff) chat.push({ who: 'problem', text: 'El flujo no respondió nada. Revisá que tenga algún mensaje.' });
  } catch (err) { chat.push({ who: 'problem', text: 'No se pudo enviar: ' + err.message }); }
  renderChat();
}
async function toggleMic() {            // grabar → pasar a texto → mandar
  if (voiceState === 'listening') { voiceState = 'thinking'; renderChat(); try { voiceStop?.(); } catch {} return; }
  if (voiceState) return;
  voiceState = 'listening'; renderChat();
  try {
    voiceStop = await window.parlaVoice.record((text) => {
      voiceState = ''; voiceStop = null;
      if (String(text || '').trim()) sendText(String(text).trim()); else renderChat();
    }, { language: lastLang || langs()[0], agent: agent.id, onState: (st) => { voiceState = ['listening', 'thinking'].includes(st) ? st : ''; renderChat(); } });
  } catch (err) { voiceState = ''; voiceStop = null; chat.push({ who: 'problem', text: 'No se pudo usar el micrófono: ' + (err?.message || err) }); renderChat(); }
}
const VIA = { ia: ['spark', 'Respondió la IA'], knowledge: ['book', 'Respondió con Conocimiento'] };
const sourceName = (x) => typeof x === 'string' ? x : x?.title || x?.doc || x?.text || '';
function chatItem(m, i) {
  const out = [h('div', { class: 'msg ' + m.who }, m.who === 'human' ? h('span', { class: 'who' }, m.by ? m.by + ' (persona)' : 'Una persona del equipo') : null, m.text)];
  if (m.via && VIA[m.via]) {
    const names = (m.sources || []).map(sourceName).filter(Boolean);
    out.push(h('span', { class: 'via', title: names.length ? 'Fuentes: ' + names.join(' · ') : null }, icon(VIA[m.via][0]), VIA[m.via][1], names.length ? ' (' + names.length + (names.length === 1 ? ' fuente)' : ' fuentes)') : null));
  }
  if (m.buttons?.length && !chat.slice(i + 1).some((x) => x.who === 'user'))          // solo se tocan los del último mensaje
    out.push(h('div', { class: 'reply-btns' }, m.buttons.map((b) => h('button', { type: 'button', disabled: !!handoff, onclick: () => sendText(String(b.value || b.label), b.label) }, b.label))));

}
function renderChat() {
  const old = $('#chat form input'), hadFocus = !document.activeElement || document.activeElement === document.body || $('#chat')?.contains(document.activeElement);
  const input = h('input', { placeholder: handoff ? 'Escribile como cliente: le llega a la persona…' : 'Escribile al bot…', 'aria-label': 'Mensaje', autocomplete: 'off', value: old?.value || '' });

  const reset = () => startChat({});
  const filled = Object.entries(lastSlots).filter(([, v]) => v != null && v !== '');
  const log = h('div', { id: 'log', 'aria-live': 'polite' }, chat.length ? chat.map(chatItem)
    : h('p', { class: 'chat-start' }, 'Escribile al bot como lo haría un cliente. Abajo de cada mensaje vas a ver qué entendió.',
      agent?.flows.some((f) => f.trigger === START) ? ' Para ver cómo arranca solo, tocá «Empezar de nuevo».' : ''));
  const envs = agent?.environments || {}, ENVS = { draft: 'Borrador', staging: 'Pruebas', production: 'Producción' };
  const choices = Object.keys(ENVS).filter((k) => k === 'draft' || envs[k] != null);
  if (!choices.includes(testEnv)) testEnv = 'draft';
  const envPick = choices.length > 1 ? pick(choices.map((k) => [k, ENVS[k] + (envs[k] != null ? ' (v' + envs[k] + ')' : '')]), testEnv,
    (k) => { testEnv = k; startChat({}); }, 'Qué versión probar') : null;
  const voice = agent && voiceOk();
  $('#chat').replaceChildren(...[
    h('div', { class: 'chat-head', style: 'flex-wrap:wrap;gap:8px' }, h('h2', { class: 'grow' }, 'Probar'), envPick ? h('span', { class: 'row', style: 'gap:6px;font-size:13px;color:var(--muted)' }, envPick) : null,
      agent && lastLang && (langs().length > 1 || lastLang !== langs()[0]) ? h('span', { class: 'chip', title: 'El idioma en que está respondiendo el bot' }, 'Idioma: ' + (LANGS[lastLang] || lastLang)) : null,
      h('button', { class: 'btn quiet small', onclick: reset }, icon('redo'), 'Empezar de nuevo'), iconBtn('x', 'Cerrar el panel de prueba', () => setChat(false))),
    testEnv !== 'draft' ? h('p', { class: 'help', style: 'font-size:13px;padding:0 16px 8px' }, 'Estás probando la v' + envs[testEnv] + ' de ' + ENVS[testEnv] + ', tal como la usa la API. Lo que cambies en el borrador no se ve acá hasta que publiques.') : null,
    agent ? startBox() : null,

    filled.length || lastTrace.length ? h('details', {}, h('summary', {}, 'Qué tiene anotado el bot (' + filled.length + (filled.length === 1 ? ' slot' : ' slots') + ')'),
      h('dl', { class: 'kv' }, filled.map(([k, v]) => [h('dt', {}, k), h('dd', {}, typeof v === 'string' ? v : JSON.stringify(v))])),
      lastTrace.length ? h('dl', { class: 'kv' }, h('dt', {}, 'Último turno'), h('dd', {}, lastTrace.join(', '))) : null) : null,
    agent && canEdit() && testEnv === 'draft' && untrained() && !training ? trainNote() : null,
    handoff ? h('div', { class: 'notice handoff-bar', role: 'status' }, icon('hand'), 'Ahora responde una persona (Bandeja). El bot no contesta hasta que la devuelvan.') : null,
    voiceState ? h('p', { class: 'voice-state', role: 'status' }, voiceState === 'listening' ? 'Escuchando… tocá el micrófono para terminar.' : 'Pasando tu voz a texto…') : null,
    h('form', { onsubmit: send }, input,
      voice ? h('button', { type: 'button', class: 'icon-btn' + (voiceState === 'listening' ? ' listening' : ''), style: 'width:40px;height:40px;border-radius:50%',
        'aria-label': voiceState === 'listening' ? 'Terminar de grabar' : 'Hablarle al bot', title: voiceState === 'listening' ? 'Terminar de grabar' : 'Hablarle al bot',
        disabled: voiceState === 'thinking', onclick: toggleMic }, icon('mic')) : null,
      voice ? h('button', { type: 'button', class: 'icon-btn', style: 'width:40px;height:40px;border-radius:50%', 'aria-pressed': String(speakOn),
        'aria-label': 'Leer en voz alta las respuestas', title: speakOn ? 'Lee en voz alta las respuestas (tocá para apagar)' : 'Leer en voz alta las respuestas',
        onclick: () => { speakOn = !speakOn; try { localStorage.setItem('parla.speak', speakOn ? '1' : '0'); } catch {} renderChat(); } }, icon('volume')) : null,
