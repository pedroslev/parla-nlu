name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python -m compileall -q app.py mcp_server.py parla tests
      - name: JavaScript parses
        run: for f in web/static/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # test_knowledge and test_mcp train real agents: they need the embedding model (~1.2 GB), cached below.
      PARLA_EMBED_CACHE: ${{ github.workspace }}/.cache/embeddings
      HF_HOME: ${{ github.workspace }}/.cache/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      # Core only: without requirements-voice.txt and ffmpeg, test_voice prints «saltado» and passes.
      # There is no Ollama on the runner either: test_ai skips its model part and still tests dates and fallbacks.
      - run: pip install -r requirements.txt -r requirements-providers.txt
      - name: Embedding model name
        id: model
        run: echo "name=$(grep -Po '^MODEL = "\K[^"]+' parla/server.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/embeddings
          # Same model for every Python version; a new MODEL in parla/server.py downloads it once again.
          key: embed-${{ steps.model.outputs.name }}
      - run: python tests/run_all.py
      - name: Conversation tests of the example bot
        run: python -m parla.bottests examples/pizzeria.json
      # Perf smoke (tests/perf/load.py): 20 concurrent conversations for 10 s on a temporary server. The floor is far
      # below a laptop (~270 turns/s on an M4) so a slow runner passes; a regression to the old server or any error fails.
      - name: Perf smoke
        run: python tests/perf/load.py --conc 20 --seconds 10 --floor 15

  # The same suite on Postgres (PARLA_DATABASE_URL): each test process gets its own schema (tests/support.py), and
  # test_cluster runs two real replicas on the same database (turn order, bus, queue, leader failover).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parla
          POSTGRES_PASSWORD: parla
          POSTGRES_DB: parla
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parla" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PARLA_EMBED_CACHE: ${{ github.workspace }}/.cache/embeddings
      HF_HOME: ${{ github.workspace }}/.cache/hf
      PARLA_DATABASE_URL: postgresql://parla:parla@127.0.0.1:5432/parla
      PARLA_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt -r requirements-providers.txt -r requirements-postgres.txt
      - name: Embedding model name
        id: model
        run: echo "name=$(grep -Po '^MODEL = "\K[^"]+' parla/server.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/embeddings
          key: embed-${{ steps.model.outputs.name }}
      - run: python tests/run_all.py

  # tests/ui/run.py: a temporary Parla with 4 roles and both examples, swept in headless Chrome (role x language x section).
  ui:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARLA_EMBED_CACHE: ${{ github.workspace }}/.cache/embeddings
      HF_HOME: ${{ github.workspace }}/.cache/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Embedding model name
        id: model
        run: echo "name=$(grep -Po '^MODEL = "\K[^"]+' parla/server.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/embeddings
          key: embed-${{ steps.model.outputs.name }}
      - name: UI sweep
        run: python tests/ui/run.py
        env:
          CHROME: google-chrome
